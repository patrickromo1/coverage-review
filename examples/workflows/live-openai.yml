name: Live coverage review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  review:
    # Forks and Dependabot never receive OPENAI_API_KEY and do not enter this job.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: coverage-review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm github -- --review --provider openai --model YOUR_SUPPORTED_MODEL --publish-check
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-review-result
          path: ${{ steps.coverage-review.outputs.result-path }}
          if-no-files-found: error
